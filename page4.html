<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height Joke</title>
    <link rel="stylesheet" href="style.css">
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url("https://i.pinimg.com/736x/75/2f/2c/752f2c1cf7e93af3488d1420da3d20a5.jpg");
            background-size: contain;
            background-position: center;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .meme-container img {
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .joke-text {
            font-size: 1.8em;
            color: #4682b4; /* Steel blue text */
            font-weight: bold;
            margin-bottom: 20px;
        }

        .dots-container {
            margin-top: 30px;
        }

        .dot-link {
            display: inline-block;
            width: 15px;
            height: 15px;
            background-color: #808080; /* Gray dots */
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }

        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .home-link a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .next-page-button { /* Style for the button to the next page */
            display: inline-block;
            padding: 10px 20px;
            background-color: #f4a460;  /* Sandy Brown */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s ease;
            font-size: 1.2em;
        }

        .next-page-button:hover {
          background-color: #b22222; /* Firebrick */
        }

    </style>
</head>
<body>
    <div class="container">
    <div class="home-link">
        <a href="index.html">Home</a>
    </div>
    <div class="meme-container">
        <img src="[Link to Seventeen Meme 1]" alt="Seventeen Meme">
    </div>
    <div class="joke-text">
        JOKESSS ON U UR THE TALLEST OF ALL TIME
    </div>
    <div class="dots-container">
        <a href="page5.html" class="dot-link"></a>
        <a href="page5.html" class="dot-link"></a>
        <a href="page5.html" class="dot-link"></a>
        <a href="page5.html" class="dot-link"></a>
        <a href="page5.html" class="dot-link"></a>
    </div>
</div>
    
</body>
</html>
