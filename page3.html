<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increase Height</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url("https://i.pinimg.com/originals/35/8f/45/358f45d90d69782e40a4e21d6ef115aa.gif");
            background-size: contain;
            background-position: top;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
        }

        .height-button a {
            display: inline-block;
            padding: 15px 30px;
            background-color: #dda0dd; /* Plum button */
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        .height-button a:hover {
            background-color: #b8860b; /* Dark goldenrod hover */
        }

        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .home-link a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="home-link">
        <a href="index.html">Home</a>
    </div>
    <div class="height-button">
        <a href="page4.html">CLICK TO INCREASE HEIGHTTTT</a>
    </div>
</div>
</body>
</html>
